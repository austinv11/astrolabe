[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "astrolabe"
dynamic = ["version"]
description = "Lightweight spatial transcriptomics analysis built on MuData/AnnData"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Austin Varela", email = "austinv11@gmail.com" },
]
keywords = [
    "spatial transcriptomics", "single-cell", "bioinformatics",
    "xenium", "merscope", "cosmx", "anndata", "mudata", "scanpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anndata>=0.12.16",
    "awkward>=2.9.0",
    "geopandas>=1.1.3",
    "imagecodecs>=2024.1.1",
    "leidenalg>=0.10.2",
    "matplotlib>=3.10.9",
    "mudata>=0.3.8",
    "pyarrow>=24.0.0",
    # <3: tl relies on esda 2.x's retained-simulation attributes (.rlisas/.sim)
    # and recomputes pseudo-p two-sided from them; the announced esda 3.0
    # p-value convention change should be revalidated before unpinning.
    "esda>=2.6.0,<3",
    "scanpy>=1.12.1",
    "scikit-image>=0.22",
    "scikit-learn>=1.5.0",
    "scikit-misc>=0.5.1",
    "shapely>=2.1.2",
    "tifffile>=2024.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
    "python-igraph>=1.0.0",
    "joblib>=1.5.3",
]

[project.urls]
Homepage      = "https://github.com/austinv11/astrolabe"
Repository    = "https://github.com/austinv11/astrolabe"
"Bug Tracker" = "https://github.com/austinv11/astrolabe/issues"

[project.optional-dependencies]
cohort = ["pydeseq2>=0.5.4,<0.6"]
communication = ["liana>=1.10,<2"]
napari   = ["napari>=0.5.0"]
cellpose = ["cellpose"]
stardist = ["stardist", "tensorflow"]
harmony  = [
    "harmonypy",
]
som      = [
    "minisom>=2.3.5,<3",
]
dev      = [
    "ipykernel>=6",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.1",
    "pytest>=8",
]
# gpu is intentionally absent from 'all': install rapids-singlecell-cu12 or -cu13 directly
all      = ["astrolabe[napari,cellpose,stardist,harmony,som,cohort,communication]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["astrolabe"]
# Bundled Inter font files (astrolabe/pl/_fonts/) for the plot theme system
artifacts = ["astrolabe/pl/_fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The optional Napari plugin adds Qt/session fixtures these tests do not use
# and can hold the runner open after completion.
addopts = "-p no:napari"
